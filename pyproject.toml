[project]
name = "findmy-mqtt-bridge"
version = "0.1.0"
description = "Apple Find My proxy for Home Assistant: decrypt the on-device Find My cache on the macOS VM and publish every device + item as an MQTT device_tracker."
requires-python = ">=3.9"
dependencies = [
    "ha-mqtt-bridge-toolkit[yaml]>=0.5.0",
    "paho-mqtt>=2.1.0",
    "cryptography>=42.0",
]

[project.scripts]
findmy-mqtt-bridge = "findmy_bridge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findmy_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# uv resolves the toolkit from its path (uv 0.5+). For other installers:
# pip install -e ./_shared/ha-mqtt-bridge-toolkit beforehand.
[tool.uv.sources]
ha-mqtt-bridge-toolkit = { path = "./_shared/ha-mqtt-bridge-toolkit", editable = true }
